 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=1.0, minimum-scale=0.5">
    <title>LinguaMaster Pro · 翻译 + 发音 + 词性 + 例句</title>
    <style>
        :root {
            --bg-main: #fafaf8;
            --bg-white: #ffffff;
            --gold-light: #fef9f0;
            --gold-dark: #c8a45c;
            --gold-border: #d4b87a;
            --green-accent: #4a9c6c;
            --green-light: #e8f5e9;
            --green-border: #66bb6a;
            --text-dark: #2d2d2d;
            --text-medium: #555555;
            --text-light: #777777;
            --text-muted: #999999;
            --purple-accent: #7c5cfc;
            --red-rec: #e0555f;
            --blue-info: #5b9cf5;
            --radius-lg: 18px;
            --radius-md: 14px;
            --radius-sm: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Noto Sans', 'PingFang SC', 'Microsoft YaHei', 'Inter', system-ui, sans-serif;
            background: #f0f0ed;
            min-height: 100vh;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            margin: 0;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            max-height: 100vh;
            background: var(--bg-main);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08), 0 2px 10px rgba(0, 0, 0, 0.04);
            border: 1px solid #e8e8e2;
        }

        /* ---- Header ---- */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px 8px 16px;
            flex-shrink: 0;
            background: var(--bg-white);
            border-bottom: 1px solid #f0ece5;
        }
        .app-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #4a4a4a;
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .app-title .icon {
            font-size: 1.3rem;
        }
        .menu-btn {
            background: #faf8f5;
            border: 1.5px solid #e0d8c8;
            color: #5a5a5a;
            font-weight: 600;
            font-size: 0.8rem;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }
        .menu-btn:hover {
            background: #f5f0e8;
            border-color: #c8a45c;
        }

        /* ---- Menu Panel ---- */
        .menu-panel {
            position: absolute;
            top: 52px;
            right: 14px;
            background: #ffffff;
            border-radius: 16px;
            padding: 10px 14px;
            display: none;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            border: 1.5px solid #e0d8c8;
            z-index: 30;
            animation: fadeDown 0.2s ease;
        }
        .menu-panel.active {
            display: flex;
        }
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .lang-option {
            background: #faf8f5;
            border: 1.5px solid #e8e0d0;
            color: #4a4a4a;
            padding: 9px 18px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .lang-option:hover {
            background: #fef9f0;
            border-color: var(--gold-dark);
            color: #3a3a3a;
        }

        /* ---- Main Content ---- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 6px 14px 8px 14px;
            gap: 7px;
            overflow: hidden;
            background: var(--bg-main);
        }

        /* ---- Meta Row ---- */
        .meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            gap: 6px;
        }
        .category-badge {
            background: #fef9f0;
            color: #8b7355;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 14px;
            border: 1.5px solid #e8dcc8;
        }
        .page-badge {
            background: #ffffff;
            color: #888888;
            font-size: 0.7rem;
            font-weight: 500;
            padding: 5px 12px;
            border-radius: 14px;
            border: 1.5px solid #e8e8e2;
        }

        /* ---- Sentence Card (Light Gold with Dark Gold Left Margin) ---- */
        .sentence-card {
            background: var(--gold-light);
            border-radius: var(--radius-lg);
            padding: 16px 16px 16px 20px;
            border: 1.5px solid #f0e6d0;
            border-left: 5px solid var(--gold-dark);
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.05);
            flex-shrink: 0;
        }
        .sentence-label {
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #b8976a;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .sentence-text {
            font-size: 1.45rem;
            font-weight: 600;
            line-height: 1.6;
            color: #3a3028;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            align-items: center;
            word-break: break-word;
        }
        .word-clickable {
            display: inline-block;
            cursor: pointer;
            padding: 3px 7px;
            border-radius: 6px;
            transition: all 0.2s;
            color: #4a3f35;
            font-weight: 500;
            font-size: inherit;
            text-decoration: underline;
            text-decoration-color: #66bb6a;
            text-decoration-thickness: 2px;
            text-underline-offset: 4px;
            position: relative;
        }
        .word-clickable:hover {
            background: rgba(102, 187, 106, 0.12);
            color: #2d5a3a;
            text-decoration-color: #4a9c6c;
        }
        .word-clickable.highlight {
            background: rgba(200, 164, 92, 0.2);
            text-decoration-color: #c8a45c;
            color: #5a4020;
        }

        /* ---- Action Row ---- */
        .action-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .btn-speak {
            background: var(--green-accent);
            border: none;
            color: #fff;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 22px;
            cursor: pointer;
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(74, 156, 108, 0.25);
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .btn-speak:hover {
            background: #3d8b5e;
            box-shadow: 0 6px 18px rgba(74, 156, 108, 0.35);
        }
        .btn-speak:active {
            transform: scale(0.95);
        }

        /* ---- Word Detail Panel (Green Border) ---- */
        .word-detail-panel {
            background: #ffffff;
            border-radius: var(--radius-md);
            padding: 12px 16px;
            border: 2px solid var(--green-border);
            border-left: 5px solid var(--green-accent);
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
            min-height: 45px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            font-size: 0.73rem;
            background: #fafff9;
        }
        .word-detail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .word-detail-word {
            font-size: 1rem;
            font-weight: 700;
            color: #2d2d2d;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .word-image {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            object-fit: cover;
            border: 1.5px solid #e0e0d8;
            display: inline-block;
            background: #f5f5f0;
        }
        .btn-pronounce {
            background: #f0faf2;
            border: 1.5px solid #a5d6a7;
            color: #2d6a3f;
            padding: 6px 12px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }
        .btn-pronounce:hover {
            background: #c8e6c9;
            border-color: #66bb6a;
        }
        .word-detail-meaning {
            font-size: 0.78rem;
            color: #3a3a3a;
            line-height: 1.5;
            padding: 6px 0;
            border-bottom: 1px solid #e8f0e5;
            font-weight: 500;
        }
        .word-detail-info {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 0.7rem;
            color: #555555;
        }
        .info-chip {
            background: #f5faf5;
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid #d0e8d0;
            font-weight: 500;
        }
        .info-chip strong {
            color: #3d6b45;
            font-weight: 700;
        }
        .word-detail-example {
            font-size: 0.72rem;
            color: #666666;
            font-style: italic;
            border-left: 3px solid var(--green-accent);
            padding-left: 10px;
            line-height: 1.45;
            margin-top: 2px;
        }

        /* ---- Recording Section ---- */
        .recording-section {
            background: #ffffff;
            border-radius: var(--radius-md);
            padding: 10px 14px;
            border: 1.5px solid #e8e8e2;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: space-between;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
        }
        .recording-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #999999;
            font-weight: 700;
        }
        .recording-controls {
            display: flex;
            gap: 5px;
        }
        .btn-rec {
            border: none;
            font-weight: 600;
            padding: 7px 12px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }
        .btn-rec-start {
            background: var(--red-rec);
            color: #fff;
        }
        .btn-rec-start:hover {
            background: #c94a53;
        }
        .btn-rec-stop {
            background: #f0f0ed;
            color: #555;
            border: 1.5px solid #d8d8d0;
        }
        .btn-rec-stop:hover {
            background: #e5e5e0;
        }
        .btn-rec-play {
            background: var(--green-accent);
            color: #fff;
        }
        .btn-rec-play:hover {
            background: #3d8b5e;
        }
        .recording-status {
            font-size: 0.68rem;
            color: #888888;
            font-weight: 500;
        }

        /* ---- Accuracy Row ---- */
        .accuracy-row {
            background: #ffffff;
            border-radius: var(--radius-sm);
            padding: 7px 14px;
            border: 1.5px solid #e8e8e2;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.68rem;
            color: #888888;
        }
        .accuracy-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green-accent);
        }

        /* ---- Navigation ---- */
        .nav-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-shrink: 0;
            padding: 4px 0;
        }
        .nav-btn {
            background: #ffffff;
            border: 1.5px solid #e0d8c8;
            color: #5a5a5a;
            font-size: 1.1rem;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }
        .nav-btn:hover {
            background: var(--gold-light);
            border-color: var(--gold-dark);
            color: #3a3028;
        }

        @media (max-width: 380px) {
            .sentence-text {
                font-size: 1.2rem;
                gap: 3px;
            }
            .word-clickable {
                padding: 2px 5px;
            }
            .btn-speak {
                padding: 8px 14px;
                font-size: 0.75rem;
            }
        }
        @media (min-height: 800px) {
            .sentence-text {
                font-size: 1.55rem;
            }
            .word-detail-panel {
                padding: 14px 18px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="app-title">
                <span class="icon">🌐</span> LinguaMaster Pro
            </div>
            <button class="menu-btn" id="menuToggleBtn">🌍 Menu</button>
        </div>
        <div class="menu-panel" id="menuPanel">
            <button class="lang-option" id="langChinese">🇨🇳 中文模式</button>
            <button class="lang-option" id="langEnglish">🇬🇧 English</button>
        </div>

        <div class="main-content">
            <div class="meta-row">
                <span class="category-badge" id="categoryBadge">📂 Daily Life</span>
                <span class="page-badge" id="pageIndicator">1 / 200</span>
            </div>

            <div class="sentence-card">
                <div class="sentence-label">📝 Current Sentence</div>
                <div class="sentence-text" id="sentenceDisplay"></div>
            </div>

            <div class="action-row">
                <button class="btn-speak" id="playSentenceBtn">🔊 Speak Sentence</button>
            </div>

            <div class="word-detail-panel" id="wordDetailPanel">
                <span style="color:#999999; font-size:0.72rem;">👆 Tap any underlined word to see its details</span>
            </div>

            <div class="recording-section">
                <span class="recording-label">🎙️ Rec</span>
                <div class="recording-controls">
                    <button class="btn-rec btn-rec-start" id="recStartBtn">▶ Start</button>
                    <button class="btn-rec btn-rec-stop" id="recStopBtn">⏹ Stop</button>
                    <button class="btn-rec btn-rec-play" id="recPlayBtn">🔊 Play</button>
                </div>
                <span class="recording-status" id="recordingStatus">Ready</span>
            </div>

            <div class="accuracy-row" id="accuracyRow">
                <span class="accuracy-dot"></span>
                <span id="accuracyText">Ready to record your voice</span>
            </div>

            <div class="nav-row">
                <button class="nav-btn" id="prevSlide">◀</button>
                <button class="nav-btn" id="nextSlide">▶</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const chineseSentences = [];
            const englishSentences = [];
            const chineseTemplates = [
                { text: "今天天气真不错，我们去公园散步吧。", cat: "日常对话" },
                { text: "她慢慢地喝着热咖啡，看着窗外的雨。", cat: "描述场景" },
                { text: "因为昨天睡得太晚，所以今天早上起不来。", cat: "因果关系" },
                { text: "你能否告诉我最近的银行在哪里？", cat: "问路指引" },
                { text: "虽然工作很忙，但他仍然坚持每天学习。", cat: "转折关系" },
                { text: "生活就像一盒巧克力，你永远不知道下一颗的味道。", cat: "人生哲理" },
                { text: "那只可爱的猫咪在阳光下睡得很香。", cat: "描述场景" },
                { text: "如果明天不下雨，我们就去爬山。", cat: "条件假设" },
                { text: "这本书比那本书有趣多了。", cat: "比较表达" },
                { text: "他不但会说中文，还会说日语和韩语。", cat: "递进关系" },
            ];
            const englishTemplates = [
                { text: "She quickly ran to the store because she needed milk.", cat: "Daily Life" },
                { text: "Although it was raining, they decided to go hiking.", cat: "Adventure" },
                { text: "Could you please show me the way to the museum?", cat: "Directions" },
                { text: "The cat sat on the mat and looked very comfortable.", cat: "Description" },
                { text: "If I had more time, I would travel around the world.", cat: "Dreams" },
                { text: "Learning a new language opens many doors.", cat: "Wisdom" },
                { text: "He not only speaks English but also French and Spanish.", cat: "Skills" },
                { text: "This restaurant is better than that one.", cat: "Comparison" },
                { text: "I have never seen such a beautiful sunset before.", cat: "Experience" },
                { text: "When she arrived, everyone was already waiting.", cat: "Narrative" },
            ];
            for (let i = 0; i < 200; i++) {
                chineseSentences.push({ ...chineseTemplates[i % 10] });
                englishSentences.push({ ...englishTemplates[i % 10] });
            }

            // Emoji图片映射
            const wordImages = {
                "今天": "📅", "天气": "☀️", "公园": "🌳", "散步": "🚶", "她": "👩", "咖啡": "☕",
                "雨": "🌧️", "因为": "💡", "昨天": "📆", "早上": "🌅", "银行": "🏦", "工作": "💼",
                "学习": "📚", "生活": "🌟", "巧克力": "🍫", "猫咪": "🐱", "阳光": "☀️", "爬山": "⛰️",
                "中文": "🇨🇳", "日语": "🇯🇵", "韩语": "🇰🇷", "书": "📖",
                "she": "👩", "store": "🏪", "milk": "🥛", "raining": "🌧️", "hiking": "🥾",
                "museum": "🏛️", "cat": "🐱", "mat": "🧘", "world": "🌍", "language": "🗣️",
                "doors": "🚪", "french": "🇫🇷", "spanish": "🇪🇸", "restaurant": "🍽️",
                "sunset": "🌅", "forest": "🌲", "wanderer": "🧭", "ruins": "🏚️", "ancient": "🏛️",
                "run": "🏃", "go": "🚶", "rain": "🌧️", "sun": "☀️", "mountain": "⛰️",
                "the": "📖", "a": "📖", "to": "➡️", "and": "➕", "but": "↔️", "if": "❓",
                "he": "👨", "i": "🙋", "you": "👉", "me": "🙋", "they": "👥", "everyone": "👥",
                "time": "⏰", "travel": "✈️", "beautiful": "✨", "comfortable": "🛋️",
            };

            // 中文词典 (英文解释 - 更长)
            const chineseWordDict = {
                "今天": { meaning: "Today — the current day, the present 24-hour period from midnight to midnight.", pronunciation: "jīn tiān", pos: "noun", example: "Today is Monday and we have an important meeting at 10 AM." },
                "天气": { meaning: "Weather — the state of the atmosphere at a particular time and place, including temperature and precipitation.", pronunciation: "tiān qì", pos: "noun", example: "The weather today is perfect for outdoor activities and picnics." },
                "真不错": { meaning: "Really good, excellent, not bad at all — expresses strong approval or satisfaction.", pronunciation: "zhēn bú cuò", pos: "adjective", example: "Your Chinese speaking skills are really good, I'm impressed!" },
                "我们": { meaning: "We, us — refers to the speaker together with one or more other people.", pronunciation: "wǒ men", pos: "pronoun", example: "We are going to have dinner together at the new restaurant." },
                "去": { meaning: "To go — to move or travel from one place to another.", pronunciation: "qù", pos: "verb", example: "I go to the office every morning by subway." },
                "公园": { meaning: "Park — a large public garden or area of land used for recreation and enjoyment.", pronunciation: "gōng yuán", pos: "noun", example: "The children are playing happily in the park near our house." },
                "散步": { meaning: "To take a walk — to walk at a leisurely pace for exercise or pleasure.", pronunciation: "sàn bù", pos: "verb", example: "After dinner, I enjoy taking a relaxing walk along the river." },
                "吧": { meaning: "A sentence-final particle used to make suggestions or soften the tone of a request.", pronunciation: "ba", pos: "particle", example: "Let's go now, it's getting late and we should head home." },
                "她": { meaning: "She, her — third person singular female pronoun used to refer to a woman or girl.", pronunciation: "tā", pos: "pronoun", example: "She is my best friend and we have known each other for ten years." },
                "慢慢地": { meaning: "Slowly, gradually — doing something at a low speed without rushing or hurrying.", pronunciation: "màn màn de", pos: "adverb", example: "Please speak slowly so that I can understand every word clearly." },
                "喝": { meaning: "To drink — to take liquid into the mouth and swallow it.", pronunciation: "hē", pos: "verb", example: "Would you like to drink some water or would you prefer hot tea?" },
                "热咖啡": { meaning: "Hot coffee — a warm beverage made from roasted coffee beans, served at a high temperature.", pronunciation: "rè kā fēi", pos: "noun", example: "Drinking a cup of hot coffee in winter feels extremely comfortable and warming." },
                "看着": { meaning: "Looking at, watching — directing one's gaze toward something continuously.", pronunciation: "kàn zhe", pos: "verb", example: "She is staring out the window, quietly watching the beautiful scenery outside." },
                "窗外": { meaning: "Outside the window — the area or view that is visible through a window.", pronunciation: "chuāng wài", pos: "noun", example: "It's snowing heavily outside the window, covering everything in white." },
                "雨": { meaning: "Rain — water that falls in drops from clouds in the atmosphere.", pronunciation: "yǔ", pos: "noun", example: "It's raining heavily outside, so you should take an umbrella with you." },
                "因为": { meaning: "Because, since — introduces the reason or cause for an action or situation.", pronunciation: "yīn wèi", pos: "conjunction", example: "Because I was feeling sick yesterday, I didn't go to school at all." },

            function getFallbackExplanation(word, lang) {
                const img = wordImages[word] || getEmojiForWord(word);
                if (lang === 'chinese') {
                    return {
                        meaning: `"${word}" is a Chinese word meaning "${word}" in context. It is used in everyday conversation and writing.`,
                        pronunciation: word,
                        pos: "word",
                        example: `Here is an example: "${word}" appears naturally in this sentence.`,
                        image: img
                    };
                } else {
                    return {
                        meaning: `"${word}" is an English word referring to "${word}" in this context. It is commonly used in both spoken and written English.`,
                        pronunciation: `/${word}/`,
                        pos: "word",
                        example: `Example usage: The word "${word}" is used in this sentence.`,
                        image: img
                    };
                }
            }

            function getEmojiForWord(word) {
                const lower = word.toLowerCase();
                if (lower.includes('run')) return '🏃';
                if (lower.includes('walk')) return '🚶';
                if (lower.includes('book')) return '📖';
                if (lower.includes('house')) return '🏠';
                if (lower.includes('car')) return '🚗';
                if (lower.includes('tree')) return '🌳';
                if (lower.includes('flower')) return '🌸';
                if (lower.includes('water')) return '💧';
                if (lower.includes('fire')) return '🔥';
                if (lower.includes('food')) return '🍽️';
                if (lower.includes('love')) return '❤️';
                if (lower.includes('happy')) return '😊';
                if (lower.includes('sad')) return '😢';
                return '📝';
            }

            let currentLanguage = 'chinese';
            let currentSlideIndex = 0;
            let mediaRecorder = null;
            let audioChunks = [];
            let recordedAudioURL = null;
            let isRecording = false;
            let lastTappedWord = null;

            const sentenceDisplay = document.getElementById('sentenceDisplay');
            const pageIndicator = document.getElementById('pageIndicator');
            const categoryBadge = document.getElementById('categoryBadge');
            const wordDetailPanel = document.getElementById('wordDetailPanel');
            const recordingStatus = document.getElementById('recordingStatus');
            const accuracyText = document.getElementById('accuracyText');
            const accuracyDot = document.querySelector('.accuracy-dot');
            const prevBtn = document.getElementById('prevSlide');
            const nextBtn = document.getElementById('nextSlide');
            const menuToggleBtn = document.getElementById('menuToggleBtn');
            const menuPanel = document.getElementById('menuPanel');
            const langChineseBtn = document.getElementById('langChinese');
            const langEnglishBtn = document.getElementById('langEnglish');
            const playSentenceBtn = document.getElementById('playSentenceBtn');
            const recStartBtn = document.getElementById('recStartBtn');
            const recStopBtn = document.getElementById('recStopBtn');
            const recPlayBtn = document.getElementById('recPlayBtn');

            function getCurrentSentences() { return currentLanguage === 'chinese' ? chineseSentences : englishSentences; }
            function getCurrentDictionary() { return currentLanguage === 'chinese' ? chineseWordDict : englishWordDict; }
            function getCurrentEntry() { return getCurrentSentences()[currentSlideIndex] || { text: '', cat: '' }; }
            function getCurrentSentenceText() { return getCurrentEntry().text; }

            function renderSentence(text) {
                sentenceDisplay.innerHTML = '';
                if (!text) return;
                let words = [];
                if (currentLanguage === 'chinese') {
                    words = text.match(/[\u4e00-\u9fa5]+|[，。！？、；：“”‘’（）…\.\?,!;:]+/g) || [text];
                } else {
                    words = text.split(/(\s+|[.,!?;:])/g).filter(w => w.trim() !== '');
                }
                words.forEach(word => {
                    const span = document.createElement('span');
                    span.className = 'word-clickable';
                    span.textContent = word;
                    if (lastTappedWord === word) span.classList.add('highlight');
                    span.addEventListener('click', (e) => {
                        e.stopPropagation();
                        document.querySelectorAll('.word-clickable.highlight').forEach(el => el.classList.remove('highlight'));
                        span.classList.add('highlight');
                        lastTappedWord = word;
                        showWordDetail(word);
                        pronounceWord(word);
                    });
                    sentenceDisplay.appendChild(span);
                });
            }

            function showWordDetail(word) {
                const cleanWord = word.trim();
                const dictionary = getCurrentDictionary();
                let entry = dictionary[cleanWord];
                if (!entry) entry = getFallbackExplanation(cleanWord, currentLanguage);
                const imageEmoji = entry.image || wordImages[cleanWord] || getEmojiForWord(cleanWord);
                wordDetailPanel.innerHTML = `
                    <div class="word-detail-header">
                        <span class="word-detail-word">
                            <span class="word-image">${imageEmoji}</span> ${cleanWord}
                        </span>
                        <button class="btn-pronounce" id="btnPronounceDetail">🔊 Pronounce</button>
                    </div>
                    <div class="word-detail-meaning">${entry.meaning}</div>
                    <div class="word-detail-info">
                        <span class="info-chip"><strong>Pronunciation</strong> ${entry.pronunciation}</span>
                        <span class="info-chip"><strong>POS</strong> ${entry.pos}</span>
                    </div>
                    <div class="word-detail-example">💡 ${entry.example}</div>
                `;
                const btnP = document.getElementById('btnPronounceDetail');
                if (btnP) btnP.addEventListener('click', (e) => { e.stopPropagation(); pronounceWord(cleanWord); });
            }

            function pronounceWord(word) {
                if (!window.speechSynthesis) return;
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(word);
                u.lang = currentLanguage === 'chinese' ? 'zh-CN' : 'en-US';
                u.rate = 0.85;
                window.speechSynthesis.speak(u);
            }

            function playWholeSentence() {
                const s = getCurrentSentenceText();
                if (!s || !window.speechSynthesis) return;
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(s);
                u.lang = currentLanguage === 'chinese' ? 'zh-CN' : 'en-US';
                u.rate = 0.82;
                window.speechSynthesis.speak(u);
            }

            function updateSlide() {
                const entry = getCurrentEntry();
                renderSentence(entry.text);
                pageIndicator.textContent = `${currentSlideIndex + 1} / 200`;
                categoryBadge.textContent = '📂 ' + (entry.cat || 'General');
                wordDetailPanel.innerHTML = `<span style="color:#999999; font-size:0.72rem;">👆 Tap any underlined word to see its details</span>`;
                lastTappedWord = null;
                accuracyText.textContent = 'Ready to record your voice';
                accuracyDot.style.background = 'var(--green-accent)';
            }

            function switchLanguage(lang) {
                if (lang === currentLanguage) return;
                currentLanguage = lang;
                currentSlideIndex = 0;
                updateSlide();
                menuPanel.classList.remove('active');
            }

            async function startRecording() {
                if (!navigator.mediaDevices?.getUserMedia) { alert('Recording not supported'); return; }
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    recordedAudioURL = null;
                    mediaRecorder.ondataavailable = e => { if (e.data.size) audioChunks.push(e.data); };
                    mediaRecorder.onstop = () => {
                        recordedAudioURL = URL.createObjectURL(new Blob(audioChunks, { type: 'audio/webm' }));
                        recordingStatus.textContent = 'Stopped';
                        accuracyText.textContent = '✅ Recording complete';
                        accuracyDot.style.background = '#c8a45c';
                        stream.getTracks().forEach(t => t.stop());
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    recordingStatus.textContent = '🔴 Rec';
                    accuracyText.textContent = 'Recording in progress...';
                    accuracyDot.style.background = '#e0555f';
                } catch (e) { alert('Mic error: ' + e.message); }
            }
            function stopRecording() { if (mediaRecorder?.state === 'recording') { mediaRecorder.stop(); isRecording = false; } }
            function playRecording() {
                if (recordedAudioURL) {
                    const a = new Audio(recordedAudioURL);
                    a.play();
                    recordingStatus.textContent = '▶ Play';
                    a.onended = () => { recordingStatus.textContent = 'Ready'; accuracyText.textContent = '✅ Done'; accuracyDot.style.background = 'var(--green-accent)'; };
                } else alert('Record first.');
            }

            playSentenceBtn.addEventListener('click', playWholeSentence);
            recStartBtn.addEventListener('click', startRecording);
            recStopBtn.addEventListener('click', stopRecording);
            recPlayBtn.addEventListener('click', playRecording);
            prevBtn.addEventListener('click', () => { if (currentSlideIndex > 0) { currentSlideIndex--; updateSlide(); } });
            nextBtn.addEventListener('click', () => { if (currentSlideIndex < 199) { currentSlideIndex++; updateSlide(); } });
            menuToggleBtn.addEventListener('click', (e) => { e.stopPropagation(); menuPanel.classList.toggle('active'); });
            langChineseBtn.addEventListener('click', () => switchLanguage('chinese'));
            langEnglishBtn.addEventListener('click', () => switchLanguage('english'));
            document.addEventListener('click', (e) => { if (!menuPanel.contains(e.target) && e.target !== menuToggleBtn) menuPanel.classList.remove('active'); });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' && currentSlideIndex > 0) { currentSlideIndex--; updateSlide(); }
                if (e.key === 'ArrowRight' && currentSlideIndex < 199) { currentSlideIndex++; updateSlide(); }
            });
            updateSlide();
        })();
    </script>
</body>
</html>
