 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0, minimum-scale=0.5">
    <title>LinguaMaster Pro · 翻译 + 发音 + 词性 + 例句</title>
    <style>
        :root {
            --bg-main: #0f0f1a;
            --bg-card: #1a1a2e;
            --bg-card-inner: #1e1e32;
            --bg-detail: #1a1a2e;
            --accent-purple: #7c5cfc;
            --accent-purple-light: #9b83ff;
            --accent-gold: #e8b84b;
            --accent-gold-light: #f0cc6e;
            --text-primary: #f0edf5;
            --text-secondary: #b8b5c9;
            --text-muted: #8a879e;
            --text-heading: #d4c8f0;
            --border-subtle: #2a2a40;
            --border-medium: #3a3a52;
            --red-rec: #e0555f;
            --green-play: #4cceac;
            --blue-info: #5b9cf5;
            --radius-xl: 24px;
            --radius-lg: 18px;
            --radius-md: 14px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.4);
            --shadow-btn: 0 4px 14px rgba(124, 92, 252, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Noto Sans', 'PingFang SC', 'Microsoft YaHei', 'Inter', system-ui, sans-serif;
            background: var(--bg-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            margin: 0;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            height: 96vh;
            max-height: 920px;
            background: var(--bg-main);
            border-radius: 32px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.03);
        }

        /* ---- Header ---- */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 18px 8px 18px;
            flex-shrink: 0;
            background: var(--bg-main);
        }
        .app-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent-purple-light);
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .app-title span {
            color: var(--text-heading);
            font-weight: 400;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            opacity: 0.8;
        }
        .menu-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-medium);
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.85rem;
            padding: 9px 16px;
            border-radius: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .menu-btn:hover {
            background: #2a2a44;
            border-color: #555;
        }

        /* ---- Menu Panel ---- */
        .menu-panel {
            position: absolute;
            top: 65px;
            right: 16px;
            background: var(--bg-card-inner);
            border-radius: 20px;
            padding: 12px 16px;
            display: none;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            border: 1px solid var(--border-medium);
            z-index: 30;
            animation: fadeDown 0.2s ease;
        }
        .menu-panel.active {
            display: flex;
        }
        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .lang-option {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 10px 18px;
            border-radius: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .lang-option:hover {
            background: var(--accent-purple);
            border-color: var(--accent-purple);
            color: #fff;
        }

        /* ---- Scrollable Body ---- */
        .scroll-body {
            flex: 1;
            overflow-y: auto;
            padding: 6px 14px 14px 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }
        .scroll-body::-webkit-scrollbar {
            width: 3px;
        }
        .scroll-body::-webkit-scrollbar-thumb {
            background: var(--border-medium);
            border-radius: 8px;
        }

        /* ---- Category & Page Row ---- */
        .meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 8px;
        }
        .category-badge {
            background: #1f1a2e;
            color: #c8b5e8;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 18px;
            letter-spacing: 0.4px;
            border: 1px solid #3b3050;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .page-badge {
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 0.78rem;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 18px;
            border: 1px solid var(--border-subtle);
        }

        /* ---- Sentence Card ---- */
        .sentence-card {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            padding: 22px 18px;
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-card);
            flex-shrink: 0;
        }
        .sentence-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.8px;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 700;
            opacity: 0.8;
        }
        .sentence-text {
            font-size: 1.65rem;
            font-weight: 600;
            line-height: 1.7;
            color: var(--text-primary);
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            word-break: break-word;
        }
        .word-clickable {
            display: inline-block;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 10px;
            transition: all 0.2s;
            color: #e6dcc0;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            position: relative;
        }
        .word-clickable:hover {
            background: rgba(124, 92, 252, 0.18);
            color: #fff;
            border-bottom: 2px solid var(--accent-purple-light);
        }
        .word-clickable:active {
            transform: scale(0.93);
            background: rgba(124, 92, 252, 0.3);
        }
        .word-clickable.highlight {
            background: rgba(232, 184, 75, 0.2);
            border-bottom: 2px solid var(--accent-gold);
            color: #fff;
        }

        /* ---- Action Row (Speak Sentence) ---- */
        .action-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .btn-speak {
            background: var(--accent-purple);
            border: none;
            color: #fff;
            font-weight: 600;
            padding: 11px 20px;
            border-radius: 24px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
            box-shadow: 0 6px 18px rgba(124, 92, 252, 0.35);
            letter-spacing: 0.3px;
            flex-shrink: 0;
        }
        .btn-speak:hover {
            background: #8f75ff;
            box-shadow: 0 10px 24px rgba(124, 92, 252, 0.5);
            transform: translateY(-1px);
        }
        .btn-speak:active {
            transform: scale(0.95);
        }

        /* ---- Word Detail Panel ---- */
        .word-detail-panel {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 16px 18px;
            border: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
            transition: all 0.25s;
            min-height: 50px;
            box-shadow: var(--shadow-card);
        }
        .word-detail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }
        .word-detail-word {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.3px;
        }
        .btn-pronounce {
            background: transparent;
            border: 1px solid var(--border-medium);
            color: var(--accent-purple-light);
            padding: 7px 14px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-pronounce:hover {
            background: rgba(124, 92, 252, 0.15);
            border-color: var(--accent-purple);
        }
        .word-detail-meaning {
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.5;
            padding: 6px 0;
            border-bottom: 1px solid var(--border-subtle);
        }
        .word-detail-info {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .info-chip {
            background: rgba(255, 255, 255, 0.03);
            padding: 5px 11px;
            border-radius: 10px;
            border: 1px solid var(--border-subtle);
            font-weight: 500;
        }
        .info-chip strong {
            color: #c0b0f0;
            font-weight: 600;
        }
        .word-detail-example {
            font-size: 0.8rem;
            color: #aaa5c8;
            font-style: italic;
            border-left: 3px solid var(--accent-purple);
            padding-left: 12px;
            margin-top: 4px;
            line-height: 1.45;
        }

        /* ---- Recording Section ---- */
        .recording-section {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 14px 16px;
            border: 1px solid var(--border-subtle);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: space-between;
            box-shadow: var(--shadow-card);
        }
        .recording-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            font-weight: 700;
        }
        .recording-controls {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }
        .btn-rec {
            border: none;
            font-weight: 600;
            padding: 9px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
            letter-spacing: 0.3px;
        }
        .btn-rec-start {
            background: var(--red-rec);
            color: #fff;
            box-shadow: 0 4px 12px rgba(224, 85, 95, 0.4);
        }
        .btn-rec-start:hover {
            background: #e86772;
        }
        .btn-rec-stop {
            background: #3a3a52;
            color: #fff;
            border: 1px solid var(--border-medium);
        }
        .btn-rec-stop:hover {
            background: #4e4e68;
        }
        .btn-rec-play {
            background: var(--green-play);
            color: #111;
            box-shadow: 0 4px 12px rgba(76, 206, 172, 0.35);
        }
        .btn-rec-play:hover {
            background: #5ddbba;
        }
        .recording-status {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
            min-width: 45px;
            text-align: center;
        }

        /* ---- Accuracy Row ---- */
        .accuracy-row {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 9px 14px;
            border: 1px solid var(--border-subtle);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 0.75rem;
            color: var(--text-muted);
            box-shadow: var(--shadow-card);
        }
        .accuracy-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green-play);
            box-shadow: 0 0 8px rgba(76, 206, 172, 0.5);
        }

        /* ---- Navigation ---- */
        .nav-row {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-shrink: 0;
        }
        .nav-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            font-size: 1.2rem;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .nav-btn:hover {
            background: var(--accent-purple);
            border-color: var(--accent-purple);
            color: #fff;
            box-shadow: 0 8px 20px rgba(124, 92, 252, 0.4);
        }

        @media (max-width: 400px) {
            .sentence-text {
                font-size: 1.35rem;
                gap: 4px;
            }
            .word-clickable {
                padding: 3px 6px;
            }
            .btn-speak {
                padding: 9px 16px;
                font-size: 0.82rem;
            }
            .btn-rec {
                padding: 7px 10px;
                font-size: 0.72rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="app-title">
                🌐 LinguaMaster Pro <span>· 翻译 + 发音 + 词性 + 例句</span>
            </div>
            <button class="menu-btn" id="menuToggleBtn">🌍 菜单</button>
        </div>

        <!-- Menu Panel -->
        <div class="menu-panel" id="menuPanel">
            <button class="lang-option" id="langChinese">🇨🇳 中文模式 (Chinese)</button>
            <button class="lang-option" id="langEnglish">🇬🇧 English Mode</button>
        </div>

        <!-- Scrollable Body -->
        <div class="scroll-body" id="scrollBody">
            <!-- Meta Row -->
            <div class="meta-row">
                <span class="category-badge" id="categoryBadge">📂 Daily Life</span>
                <span class="page-badge" id="pageIndicator">1 / 200</span>
            </div>

            <!-- Sentence Card -->
            <div class="sentence-card">
                <div class="sentence-label">📝 CURRENT SENTENCE</div>
                <div class="sentence-text" id="sentenceDisplay"></div>
            </div>

            <!-- Speak Sentence -->
            <div class="action-row">
                <button class="btn-speak" id="playSentenceBtn">🔊 Speak Sentence</button>
            </div>

            <!-- Word Detail Panel -->
            <div class="word-detail-panel" id="wordDetailPanel">
                <span style="color:#8a879e; font-size:0.82rem;">👆 Tap a word in the sentence to see details</span>
            </div>

            <!-- Recording Section -->
            <div class="recording-section">
                <span class="recording-label">🎙️ Voice Recording</span>
                <div class="recording-controls">
                    <button class="btn-rec btn-rec-start" id="recStartBtn">▶ Start</button>
                    <button class="btn-rec btn-rec-stop" id="recStopBtn">⏹ Stop</button>
                    <button class="btn-rec btn-rec-play" id="recPlayBtn">🔊 Play</button>
                </div>
                <span class="recording-status" id="recordingStatus">Ready</span>
            </div>

            <!-- Accuracy Result -->
            <div class="accuracy-row" id="accuracyRow">
                <span class="accuracy-dot"></span>
                <span id="accuracyText">Ready — record a sentence to check accuracy</span>
            </div>

            <!-- Navigation -->
            <div class="nav-row">
                <button class="nav-btn" id="prevSlide">◀</button>
                <button class="nav-btn" id="nextSlide">▶</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ==================== 句子库 ====================
            const chineseSentences = [];
            const englishSentences = [];

            const chineseTemplates = [
                { text: "今天天气真不错，我们去公园散步吧。", cat: "日常对话" },
                { text: "她慢慢地喝着热咖啡，看着窗外的雨。", cat: "描述场景" },
                { text: "因为昨天睡得太晚，所以今天早上起不来。", cat: "因果关系" },
                { text: "你能否告诉我最近的银行在哪里？", cat: "问路指引" },
                { text: "虽然工作很忙，但他仍然坚持每天学习。", cat: "转折关系" },
                { text: "生活就像一盒巧克力，你永远不知道下一颗的味道。", cat: "人生哲理" },
                { text: "那只可爱的猫咪在阳光下睡得很香。", cat: "描述场景" },
                { text: "如果明天不下雨，我们就去爬山。", cat: "条件假设" },
                { text: "这本书比那本书有趣多了。", cat: "比较表达" },
                { text: "他不但会说中文，还会说日语和韩语。", cat: "递进关系" },
            ];

            const englishTemplates = [
                { text: "She quickly ran to the store because she needed milk.", cat: "Daily Life" },
                { text: "Although it was raining, they decided to go hiking.", cat: "Adventure" },
                { text: "Could you please show me the way to the museum?", cat: "Directions" },
                { text: "The cat sat on the mat and looked very comfortable.", cat: "Description" },
                { text: "If I had more time, I would travel around the world.", cat: "Dreams" },
                { text: "Learning a new language opens many doors.", cat: "Wisdom" },
                { text: "He not only speaks English but also French and Spanish.", cat: "Skills" },
                { text: "This restaurant is better than that one.", cat: "Comparison" },
                { text: "I have never seen such a beautiful sunset before.", cat: "Experience" },
                { text: "When she arrived, everyone was already waiting.", cat: "Narrative" },
            ];

            for (let i = 0; i < 200; i++) {
                const ci = i % chineseTemplates.length;
                chineseSentences.push({ ...chineseTemplates[ci] });
                const ei = i % englishTemplates.length;
                englishSentences.push({ ...englishTemplates[ei] });
            }

            // ==================== 词汇库 ====================
            // 中文词汇 —— 英文解释 (for Chinese sheet)
            const chineseWordDict = {
                "今天": { meaning: "today", pronunciation: "jīn tiān", pos: "noun", example: "今天是星期一，我们要开会。 (Today is Monday, we have a meeting.)" },
                "天气": { meaning: "weather", pronunciation: "tiān qì", pos: "noun", example: "今天的天气非常适合户外活动。 (Today's weather is perfect for outdoor activities.)" },
                "真不错": { meaning: "really good, not bad at all", pronunciation: "zhēn bú cuò", pos: "adjective", example: "你的中文说得真不错！ (You speak Chinese really well!)" },
                "我们": { meaning: "we, us", pronunciation: "wǒ men", pos: "pronoun", example: "我们一起去吃晚饭吧。 (Let's go have dinner together.)" },
                "去": { meaning: "to go", pronunciation: "qù", pos: "verb", example: "我每天去公司上班。 (I go to work at the company every day.)" },
                "公园": { meaning: "park, public garden", pronunciation: "gōng yuán", pos: "noun", example: "孩子们在公园里玩耍。 (The children are playing in the park.)" },
                "散步": { meaning: "to take a walk, to stroll", pronunciation: "sàn bù", pos: "verb", example: "晚饭后我喜欢在河边散步。 (I like to take a walk by the river after dinner.)" },
                "吧": { meaning: "particle indicating suggestion or request", pronunciation: "ba", pos: "particle", example: "我们走吧，时间不早了。 (Let's go, it's getting late.)" },
                "她": { meaning: "she, her", pronunciation: "tā", pos: "pronoun", example: "她是我的好朋友。 (She is my good friend.)" },
                "慢慢地": { meaning: "slowly, gradually", pronunciation: "màn màn de", pos: "adverb", example: "请慢慢地说话，我听不懂。 (Please speak slowly, I can't understand.)" },
                "喝": { meaning: "to drink", pronunciation: "hē", pos: "verb", example: "你要喝水还是喝茶？ (Would you like water or tea?)" },
                "热咖啡": { meaning: "hot coffee", pronunciation: "rè kā fēi", pos: "noun", example: "冬天喝一杯热咖啡很舒服。 (Drinking a cup of hot coffee in winter is very comfortable.)" },
                "看着": { meaning: "looking at, watching", pronunciation: "kàn zhe", pos: "verb", example: "她看着窗外的风景发呆。 (She is staring at the scenery outside the window.)" },
                "窗外": { meaning: "outside the window", pronunciation: "chuāng wài", pos: "noun", example: "窗外下着大雪。 (It's snowing heavily outside the window.)" },
                "雨": { meaning: "rain", pronunciation: "yǔ", pos: "noun", example: "外面下着大雨，带把伞吧。 (It's raining heavily outside, take an umbrella.)" },
                "因为": { meaning: "because, since", pronunciation: "yīn wèi", pos: "conjunction", example: "因为生病了，所以没去上学。 (Because I was sick, I didn't go to school.)" },
                "昨天": { meaning: "yesterday", pronunciation: "zuó tiān", pos: "noun", example: "昨天我看了一部很好的电影。 (Yesterday I watched a very good movie.)" },
                "睡得太晚": { meaning: "slept too late, went to bed too late", pronunciation: "shuì de tài wǎn", pos: "phrase", example: "昨晚睡得太晚，现在很困。 (I slept too late last night, now I'm very sleepy.)" },
                "所以": { meaning: "so, therefore", pronunciation: "suǒ yǐ", pos: "conjunction", example: "他很努力，所以进步很快。 (He works hard, so he improves quickly.)" },
                "早上": { meaning: "morning, early morning", pronunciation: "zǎo shang", pos: "noun", example: "每天早上我都六点起床。 (I get up at six every morning.)" },

            function renderSentence(text) {
                sentenceDisplay.innerHTML = '';
                if (!text) return;
                let words = [];
                if (currentLanguage === 'chinese') {
                    words = text.match(/[\u4e00-\u9fa5]+|[，。！？、；：“”‘’（）…\.\?,!;:]+/g) || [text];
                } else {
                    words = text.split(/(\s+|[.,!?;:])/g).filter(w => w.trim() !== '');
                }
                words.forEach(word => {
                    const span = document.createElement('span');
                    span.className = 'word-clickable';
                    span.textContent = word;
                    if (lastTappedWord === word) {
                        span.classList.add('highlight');
                    }
                    span.addEventListener('click', (e) => {
                        e.stopPropagation();
                        document.querySelectorAll('.word-clickable.highlight').forEach(el => el.classList.remove('highlight'));

                        lastTappedWord = word;
                        showWordDetail(word);
                        pronounceWord(word);
                    });
                    sentenceDisplay.appendChild(span);
                });

                renderSentence(entry.text);
                pageIndicator.textContent = `${currentSlideIndex + 1} / 200`;
                categoryBadge.textContent = '📂 ' + (entry.cat || (currentLanguage === 'chinese' ? '日常' : 'General'));
                wordDetailPanel.innerHTML = `<span style="color:#8a879e; font-size:0.82rem;">👆 Tap a word in the sentence to see details</span>`;
                lastTappedWord = null;
                accuracyText.textContent = 'Ready — record a sentence to check accuracy';
                accuracyDot.style.background = 'var(--green-play)';
                scrollBody.scrollTop = 0;
            }

            function switchLanguage(lang) {
                if (lang === currentLanguage) return;
                currentLanguage = lang;
                currentSlideIndex = 0;
                updateSlide();
                menuPanel.classList.remove('active');
            }

            // ==================== 录音功能 ====================
            async function startRecording() {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    alert('Your browser does not support audio recording. Please use Chrome or Edge.');
                    return;
                }
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    recordedAudioURL = null;
                    mediaRecorder.ondataavailable = event => {
                        if (event.data.size > 0) audioChunks.push(event.data);
                    };
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        recordedAudioURL = URL.createObjectURL(audioBlob);
                        recordingStatus.textContent = 'Stopped';
                        accuracyText.textContent = '✅ Recording complete — tap "Play" to listen';
                        accuracyDot.style.background = 'var(--accent-gold)';
                        stream.getTracks().forEach(track => track.stop());
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    recordingStatus.textContent = '🔴 Recording...';
                    accuracyText.textContent = 'Recording in progress...';
                    accuracyDot.style.background = '#e0555f';
                } catch (err) {
                    alert('Unable to access microphone: ' + err.message);
                }
            }

            function stopRecording() {
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                    mediaRecorder.stop();
                    isRecording = false;
                }
            }

            function playRecording() {
                if (recordedAudioURL) {
                    const audio = new Audio(recordedAudioURL);
                    audio.play().catch(e => console.log('Playback failed'));
                    recordingStatus.textContent = '▶ Playing...';
                    accuracyText.textContent = '🔊 Playing recorded audio...';
                    audio.onended = () => {
                        recordingStatus.textContent = 'Ready';
                        accuracyText.textContent = '✅ Playback finished';
                        accuracyDot.style.background = 'var(--green-play)';
                    };
                } else {
                    alert('Please record audio first.');
                }
            }

            // ==================== 事件绑定 ====================
            playSentenceBtn.addEventListener('click', playWholeSentence);
            recStartBtn.addEventListener('click', startRecording);
            recStopBtn.addEventListener('click', stopRecording);
            recPlayBtn.addEventListener('click', playRecording);

            prevBtn.addEventListener('click', () => {
                if (currentSlideIndex > 0) {
                    currentSlideIndex--;
                    updateSlide();
                }
            });
            nextBtn.addEventListener('click', () => {
                if (currentSlideIndex < 199) {
                    currentSlideIndex++;
                    updateSlide();
                }
            });

            menuToggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                menuPanel.classList.toggle('active');
            });
            langChineseBtn.addEventListener('click', () => switchLanguage('chinese'));
            langEnglishBtn.addEventListener('click', () => switchLanguage('english'));

            document.addEventListener('click', (e) => {
                if (!menuPanel.contains(e.target) && e.target !== menuToggleBtn) {
                    menuPanel.classList.remove('active');
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                    if (currentSlideIndex > 0) { currentSlideIndex--; updateSlide(); }
                } else if (e.key === 'ArrowRight') {
                    if (currentSlideIndex < 199) { currentSlideIndex++; updateSlide(); }
                }
            });

            // 初始化
            updateSlide();
        })();
    </script>
</body>
</html>
