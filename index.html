 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=1.0, minimum-scale=0.5">
    <title>LinguaMaster Pro · 翻译 + 发音 + 词性 + 例句</title>
    <style>
        :root {
            --bg-main: #f8f9fc;
            --bg-card: #ffffff;
            --bg-card-inner: #f5f3ff;
            --accent-purple: #6c5ce7;
            --accent-purple-light: #8b7cf0;
            --accent-gold: #e8a840;
            --text-primary: #2d2b3a;
            --text-secondary: #5a5770;
            --text-muted: #8a879e;
            --border-subtle: #e0ddf0;
            --border-medium: #c8c4e0;
            --red-rec: #e0555f;
            --green-play: #10b981;
            --radius-lg: 18px;
            --radius-md: 14px;
            --radius-sm: 12px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Noto Sans', 'PingFang SC', 'Microsoft YaHei', 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #f0edf8 0%, #fdfcfb 50%, #f5f2fa 100%);
            min-height: 100vh;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            margin: 0;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            max-height: 100vh;
            background: var(--bg-main);
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 60px rgba(100, 90, 140, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.04);
        }

        /* ---- Header ---- */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px 8px 16px;
            flex-shrink: 0;
            background: var(--bg-main);
        }
        .app-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-purple);
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .app-title .icon {
            font-size: 1.3rem;
        }
        .menu-btn {
            background: var(--bg-card);
            border: 1.5px solid var(--border-medium);
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.8rem;
            padding: 8px 16px;
            border-radius: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
        }
        .menu-btn:hover {
            background: var(--accent-purple);
            color: #fff;
            border-color: var(--accent-purple);
            box-shadow: 0 4px 14px rgba(108, 92, 231, 0.3);
        }

        /* ---- Menu Panel ---- */
        .menu-panel {
            position: absolute;
            top: 52px;
            right: 14px;
            background: var(--bg-card);
            border-radius: 18px;
            padding: 10px 14px;
            display: none;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.12);
            border: 1.5px solid var(--border-subtle);
            z-index: 30;
            animation: fadeDown 0.2s ease;
        }
        .menu-panel.active {
            display: flex;
        }
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .lang-option {
            background: var(--bg-card-inner);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 9px 18px;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.84rem;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .lang-option:hover {
            background: var(--accent-purple);
            color: #fff;
            border-color: var(--accent-purple);
        }

        /* ---- Main Content ---- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 6px 14px 8px 14px;
            gap: 7px;
            overflow: hidden;
        }

        /* ---- Meta Row ---- */
        .meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            gap: 8px;
        }
        .category-badge {
            background: #ede9fe;
            color: #6d5ac4;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 16px;
            border: 1px solid #d8cff0;
            letter-spacing: 0.3px;
        }
        .page-badge {
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-sm);
        }

        /* ---- Sentence Card ---- */
        .sentence-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 16px 16px;
            border: 1.5px solid var(--border-subtle);
            box-shadow: var(--shadow-md);
            flex-shrink: 0;
        }
        .sentence-label {
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 1.6px;
            color: var(--text-muted);
            margin-bottom: 7px;
            font-weight: 700;
        }
        .sentence-text {
            font-size: 1.45rem;
            font-weight: 600;
            line-height: 1.6;
            color: var(--text-primary);
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            align-items: center;
            word-break: break-word;
        }
        .word-clickable {
            display: inline-block;
            cursor: pointer;
            padding: 4px 7px;
            border-radius: 9px;
            transition: all 0.2s;
            color: #4a3f6b;
            font-weight: 500;
            font-size: inherit;
            border-bottom: 2px solid transparent;
            background: rgba(108, 92, 231, 0.04);
        }
        .word-clickable:hover {
            background: rgba(108, 92, 231, 0.12);
            color: #3b2d80;
            border-bottom: 2px solid var(--accent-purple-light);
        }
        .word-clickable.highlight {
            background: rgba(232, 168, 64, 0.18);
            border-bottom: 2px solid var(--accent-gold);
            color: #5a3e10;
        }

        /* ---- Action Row ---- */
        .action-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .btn-speak {
            background: var(--accent-purple);
            border: none;
            color: #fff;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 22px;
            cursor: pointer;
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 16px rgba(108, 92, 231, 0.3);
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .btn-speak:hover {
            background: #5b4bd5;
            box-shadow: 0 6px 20px rgba(108, 92, 231, 0.4);
        }
        .btn-speak:active {
            transform: scale(0.95);
        }

        /* ---- Word Detail Panel ---- */
        .word-detail-panel {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            border: 1.5px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            gap: 7px;
            flex-shrink: 0;
            min-height: 45px;
            box-shadow: var(--shadow-sm);
            font-size: 0.74rem;
        }
        .word-detail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .word-detail-word {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .btn-pronounce {
            background: var(--bg-card-inner);
            border: 1px solid var(--border-medium);
            color: var(--accent-purple);
            padding: 6px 12px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }
        .btn-pronounce:hover {
            background: var(--accent-purple);
            color: #fff;
            border-color: var(--accent-purple);
        }
        .word-detail-meaning {
            font-size: 0.78rem;
            color: var(--text-secondary);
            line-height: 1.5;
            padding: 5px 0;
            border-bottom: 1px solid var(--border-subtle);
        }
        .word-detail-info {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        .info-chip {
            background: #f5f3ff;
            padding: 4px 10px;
            border-radius: 10px;
            border: 1px solid var(--border-subtle);
            font-weight: 500;
        }
        .info-chip strong {
            color: #6d5ac4;
            font-weight: 700;
        }
        .word-detail-example {
            font-size: 0.7rem;
            color: #5a5770;
            font-style: italic;
            border-left: 3px solid var(--accent-purple);
            padding-left: 10px;
            line-height: 1.45;
        }

        /* ---- Recording Section ---- */
        .recording-section {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            border: 1.5px solid var(--border-subtle);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
        }
        .recording-label {
            font-size: 0.64rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 700;
        }
        .recording-controls {
            display: flex;
            gap: 5px;
        }
        .btn-rec {
            border: none;
            font-weight: 600;
            padding: 7px 12px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }
        .btn-rec-start {
            background: #fde8e8;
            color: var(--red-rec);
            border: 1px solid #f5c6cb;
        }
        .btn-rec-start:hover {
            background: var(--red-rec);
            color: #fff;
        }
        .btn-rec-stop {
            background: #f0edf5;
            color: #5a5770;
            border: 1px solid var(--border-medium);
        }
        .btn-rec-stop:hover {
            background: #5a5770;
            color: #fff;
        }
        .btn-rec-play {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        .btn-rec-play:hover {
            background: var(--green-play);
            color: #fff;
        }
        .recording-status {
            font-size: 0.66rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* ---- Accuracy Row ---- */
        .accuracy-row {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 7px 14px;
            border: 1.5px solid var(--border-subtle);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.66rem;
            color: var(--text-muted);
            box-shadow: var(--shadow-sm);
        }
        .accuracy-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green-play);
        }

        /* ---- Navigation ---- */
        .nav-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-shrink: 0;
            padding: 3px 0;
        }
        .nav-btn {
            background: var(--bg-card);
            border: 1.5px solid var(--border-subtle);
            color: var(--text-primary);
            font-size: 1.1rem;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s;
        }
        .nav-btn:hover {
            background: var(--accent-purple);
            color: #fff;
            border-color: var(--accent-purple);
            box-shadow: 0 6px 16px rgba(108, 92, 231, 0.3);
        }

        @media (max-width: 380px) {
            .sentence-text {
                font-size: 1.2rem;
                gap: 3px;
            }
            .word-clickable {
                padding: 3px 6px;
            }
            .btn-speak {
                padding: 8px 14px;
                font-size: 0.74rem;
            }
        }
        @media (min-height: 820px) {
            .sentence-text {
                font-size: 1.55rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="app-title"><span class="icon">🌐</span> LinguaMaster Pro</div>
            <button class="menu-btn" id="menuToggleBtn">🌍 Menu</button>
        </div>
        <div class="menu-panel" id="menuPanel">
            <button class="lang-option" id="langChinese">🇨🇳 中文模式</button>
            <button class="lang-option" id="langEnglish">🇬🇧 English</button>
        </div>

        <div class="main-content">
            <div class="meta-row">
                <span class="category-badge" id="categoryBadge">📂 Daily Life</span>
                <span class="page-badge" id="pageIndicator">1 / 200</span>
            </div>

            <div class="sentence-card">
                <div class="sentence-label">Current Sentence</div>
                <div class="sentence-text" id="sentenceDisplay"></div>
            </div>

            <div class="action-row">
                <button class="btn-speak" id="playSentenceBtn">🔊 Speak Sentence</button>
            </div>

            <div class="word-detail-panel" id="wordDetailPanel">
                <span style="color:#8a879e; font-size:0.72rem;">👆 Tap any word in the sentence to see its details</span>
            </div>

            <div class="recording-section">
                <span class="recording-label">🎙️ Voice</span>
                <div class="recording-controls">
                    <button class="btn-rec btn-rec-start" id="recStartBtn">▶ Start</button>
                    <button class="btn-rec btn-rec-stop" id="recStopBtn">⏹ Stop</button>
                    <button class="btn-rec btn-rec-play" id="recPlayBtn">🔊 Play</button>
                </div>
                <span class="recording-status" id="recordingStatus">Ready</span>
            </div>

            <div class="accuracy-row" id="accuracyRow">
                <span class="accuracy-dot"></span>
                <span id="accuracyText">Ready — record a sentence to check accuracy</span>
            </div>

            <div class="nav-row">
                <button class="nav-btn" id="prevSlide">◀</button>
                <button class="nav-btn" id="nextSlide">▶</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const chineseSentences = [];
            const englishSentences = [];
            const chineseTemplates = [
                { text: "今天天气真不错，我们去公园散步吧。", cat: "日常对话" },
                { text: "她慢慢地喝着热咖啡，看着窗外的雨。", cat: "描述场景" },
                { text: "因为昨天睡得太晚，所以今天早上起不来。", cat: "因果关系" },
                { text: "你能否告诉我最近的银行在哪里？", cat: "问路指引" },
                { text: "虽然工作很忙，但他仍然坚持每天学习。", cat: "转折关系" },
                { text: "生活就像一盒巧克力，你永远不知道下一颗的味道。", cat: "人生哲理" },
                { text: "那只可爱的猫咪在阳光下睡得很香。", cat: "描述场景" },
                { text: "如果明天不下雨，我们就去爬山。", cat: "条件假设" },
                { text: "这本书比那本书有趣多了。", cat: "比较表达" },
                { text: "他不但会说中文，还会说日语和韩语。", cat: "递进关系" },
            ];
            const englishTemplates = [
                { text: "The curious wanderer explored the ancient ruins hidden deep within the forest.", cat: "Adventure" },
                { text: "She quickly ran to the store because she needed fresh milk for breakfast.", cat: "Daily Life" },
                { text: "Although it was raining heavily, they still decided to go hiking in the mountains.", cat: "Adventure" },
                { text: "Could you please show me the quickest way to the nearest museum?", cat: "Directions" },
                { text: "The cat sat peacefully on the soft mat and looked very comfortable.", cat: "Description" },
                { text: "If I had more free time, I would definitely travel around the entire world.", cat: "Dreams" },
                { text: "Learning a new language opens countless doors and opportunities in life.", cat: "Wisdom" },
                { text: "He not only speaks fluent English but also French and Spanish.", cat: "Skills" },
                { text: "This small restaurant is much better than that expensive one downtown.", cat: "Comparison" },
                { text: "When she finally arrived, everyone was already waiting patiently for her.", cat: "Narrative" },
            ];
            for (let i = 0; i < 200; i++) {
                chineseSentences.push({ ...chineseTemplates[i % 10] });
                englishSentences.push({ ...englishTemplates[i % 10] });
            }

            // 中文词典 (英文解释 - 已扩展)
            const chineseWordDict = {
                "今天": { meaning: "today; the current day; this present day", pronunciation: "jīn tiān", pos: "noun", example: "Today is Monday and we have an important meeting." },
                "天气": { meaning: "weather; the state of the atmosphere at a particular time and place", pronunciation: "tiān qì", pos: "noun", example: "The weather today is perfect for outdoor activities." },
                "真不错": { meaning: "really good; excellent; not bad at all; quite impressive", pronunciation: "zhēn bú cuò", pos: "adj.", example: "Your Chinese speaking skills are really impressive!" },
                "我们": { meaning: "we; us; the speaker and one or more other people", pronunciation: "wǒ men", pos: "pron.", example: "We should go have dinner together tonight." },
                "去": { meaning: "to go; to move from one place to another", pronunciation: "qù", pos: "verb", example: "I go to the office every morning at eight." },
                "公园": { meaning: "park; a public garden or area of land for recreation", pronunciation: "gōng yuán", pos: "noun", example: "The children are happily playing in the park." },
                "散步": { meaning: "to take a walk; to stroll leisurely for pleasure", pronunciation: "sàn bù", pos: "verb", example: "After dinner I like to take a walk by the river." },
                "吧": { meaning: "particle used at the end of a sentence to indicate suggestion or request", pronunciation: "ba", pos: "part.", example: "Let's go now, it's getting quite late." },
                "她": { meaning: "she; her; a female person or animal previously mentioned", pronunciation: "tā", pos: "pron.", example: "She is my best friend and we have known each other for years." },
                "慢慢地": { meaning: "slowly; gradually; in a slow and unhurried manner", pronunciation: "màn màn de", pos: "adv.", example: "Please speak slowly so I can understand you better." },
                "喝": { meaning: "to drink; to swallow liquid", pronunciation: "hē", pos: "verb", example: "Would you like to drink some water or hot tea?" },
                "热咖啡": { meaning: "hot coffee; a warm beverage made from roasted coffee beans", pronunciation: "rè kā fēi", pos: "noun", example: "Drinking a cup of hot coffee in winter feels very comfortable." },
                "看着": { meaning: "looking at; watching; gazing at something continuously", pronunciation: "kàn zhe", pos: "verb", example: "She is looking out the window at the beautiful scenery." },
                "窗外": { meaning: "outside the window; the area visible through a window", pronunciation: "chuāng wài", pos: "noun", example: "It's snowing heavily outside the window right now." },
                "雨": { meaning: "rain; water droplets falling from clouds in the sky", pronunciation: "yǔ", pos: "noun", example: "It's raining heavily outside so take an umbrella." },
                "因为": { meaning: "because; since; for the reason that", pronunciation: "yīn wèi", pos: "conj.", example: "Because I was feeling sick I didn't go to school." },
                "昨天": { meaning: "yesterday; the day before today", pronunciation: "zuó tiān", pos: "noun", example: "Yesterday I watched a very interesting and exciting movie." },
                "睡得太晚": { meaning: "slept too late; went to bed very late at night", pronunciation: "shuì de tài wǎn", pos: "phrase", example: "I slept too late last night so now I feel very tired." },
                "所以": { meaning: "so; therefore; as a result of something", pronunciation: "suǒ yǐ", pos: "conj.", example: "He studies very hard so his progress is remarkably fast." },
                "早上": { meaning: "morning; the early part of the day before noon", pronunciation: "zǎo shang", pos: "noun", example: "Every morning I wake up at six o'clock sharp." },
                "起不来": { meaning: "can't get up; unable to wake up and rise from bed", pronunciation: "qǐ bù lái", pos: "phrase", example: "It's too cold in the winter so I can't get up early." },
                "你": { meaning: "you; the person being addressed (singular)", pronunciation: "nǐ", pos: "pron.", example: "Where are you from originally?" },
                "能否": { meaning: "could you; would it be possible to; is it possible", pronunciation: "néng fǒu", pos: "aux.", example: "Could you possibly help me with a small favor?" },
                "告诉": { meaning: "to tell; to inform someone about something", pronunciation: "gào sù", pos: "verb", example: "Please tell me the honest truth about what happened." },
                "最近": { meaning: "nearest; most recent; lately; in the near past", pronunciation: "zuì jìn", pos: "adj./adv.", example: "Where is the nearest supermarket around here?" },
                "银行": { meaning: "bank; a financial institution for deposits and loans", pronunciation: "yín háng", pos: "noun", example: "I need to go to the bank to withdraw some money." },
                "在哪里": { meaning: "where is; at what place or location", pronunciation: "zài nǎ lǐ", pos: "q.", example: "Where is my mobile phone? I can't find it anywhere." },
                "虽然": { meaning: "although; even though; despite the fact that", pronunciation: "suī rán", pos: "conj.", example: "Although I am very tired I still feel quite happy." },
                "工作": { meaning: "work; job; employment; to work at a task", pronunciation: "gōng zuò", pos: "n./v.", example: "He works at a large international technology company." },
                "很忙": { meaning: "very busy; extremely occupied with tasks", pronunciation: "hěn máng", pos: "adj.", example: "Work has been very busy and demanding lately." },
                "但": { meaning: "but; however; used to introduce a contrasting statement", pronunciation: "dàn", pos: "conj.", example: "The item is expensive but the quality is excellent." },
                "他": { meaning: "he; him; a male person or animal previously mentioned", pronunciation: "tā", pos: "pron.", example: "He is my older brother and he works as a doctor." },

                }
                words.forEach(word => {
                    const span = document.createElement('span');
                    span.className = 'word-clickable';
                    span.textContent = word;
                    if (lastTappedWord === word) span.classList.add('highlight');
                    span.addEventListener('click', (e) => {
                        e.stopPropagation();
                        document.querySelectorAll('.word-clickable.highlight').forEach(el => el.classList.remove('highlight'));
                        span.classList.add('highlight');
                        lastTappedWord = word;
                        showWordDetail(word);
                        pronounceWord(word);
                    });
                    sentenceDisplay.appendChild(span);
                });
            }

            function showWordDetail(word) {
                const cleanWord = word.trim();
                const dictionary = getCurrentDictionary();
                let entry = dictionary[cleanWord];
                if (!entry) {
                    entry = getFallbackExplanation(cleanWord, currentLanguage);
                }
                wordDetailPanel.innerHTML = `
                    <div class="word-detail-header">
                        <span class="word-detail-word">📝 ${cleanWord}</span>
                        <button class="btn-pronounce" id="btnPronounceDetail">🔊 Pronounce</button>
                    </div>
                    <div class="word-detail-meaning">${entry.meaning}</div>
                    <div class="word-detail-info">
                        <span class="info-chip"><strong>Pronunciation</strong> ${entry.pronunciation}</span>
                        <span class="info-chip"><strong>Part of Speech</strong> ${entry.pos}</span>
                    </div>
                    <div class="word-detail-example">💡 ${entry.example}</div>
                `;
                const btnP = document.getElementById('btnPronounceDetail');
                if (btnP) btnP.addEventListener('click', (e) => { e.stopPropagation();
                    pronounceWord(cleanWord); });
            }

            function pronounceWord(word) {
                if (!window.speechSynthesis) return;
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(word);
                u.lang = currentLanguage === 'chinese' ? 'zh-CN' : 'en-US';
                u.rate = 0.85;
                window.speechSynthesis.speak(u);
            }

            function playWholeSentence() {
                const s = getCurrentSentenceText();
                if (!s || !window.speechSynthesis) return;
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(s);
                u.lang = currentLanguage === 'chinese' ? 'zh-CN' : 'en-US';
                u.rate = 0.82;
                window.speechSynthesis.speak(u);
            }

            function updateSlide() {
                const entry = getCurrentEntry();
                renderSentence(entry.text);
                pageIndicator.textContent = `${currentSlideIndex + 1} / 200`;
                categoryBadge.textContent = '📂 ' + (entry.cat || 'General');
                wordDetailPanel.innerHTML = `<span style="color:#8a879e; font-size:0.72rem;">👆 Tap any word to see its meaning, pronunciation, and usage</span>`;
                lastTappedWord = null;
                accuracyText.textContent = 'Ready — record a sentence to check accuracy';
                accuracyDot.style.background = 'var(--green-play)';
            }

            function switchLanguage(lang) {
                if (lang === currentLanguage) return;
                currentLanguage = lang;
                currentSlideIndex = 0;
                updateSlide();
                menuPanel.classList.remove('active');
            }

            async function startRecording() {
                if (!navigator.mediaDevices?.getUserMedia) { alert('Recording not supported'); return; }
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    recordedAudioURL = null;
                    mediaRecorder.ondataavailable = e => { if (e.data.size) audioChunks.push(e.data); };
                    mediaRecorder.onstop = () => {
                        recordedAudioURL = URL.createObjectURL(new Blob(audioChunks, { type: 'audio/webm' }));
                        recordingStatus.textContent = 'Stopped';
                        accuracyText.textContent = '✅ Recording complete — tap Play to listen';
                        accuracyDot.style.background = 'var(--accent-gold)';
                        stream.getTracks().forEach(t => t.stop());
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    recordingStatus.textContent = '🔴 Recording';
                    accuracyText.textContent = 'Recording in progress...';
                    accuracyDot.style.background = '#e0555f';
                } catch (e) { alert('Microphone error: ' + e.message); }
            }
            function stopRecording() {
                if (mediaRecorder?.state === 'recording') { mediaRecorder.stop();
                    isRecording = false; }
            }
            function playRecording() {
                if (recordedAudioURL) {
                    const a = new Audio(recordedAudioURL);
                    a.play();
                    recordingStatus.textContent = '▶ Playing';
                    a.onended = () => { recordingStatus.textContent = 'Ready';
                        accuracyText.textContent = '✅ Playback finished successfully';
                        accuracyDot.style.background = 'var(--green-play)'; };
                } else alert('Please record audio first before playing.');
            }

            playSentenceBtn.addEventListener('click', playWholeSentence);
            recStartBtn.addEventListener('click', startRecording);
            recStopBtn.addEventListener('click', stopRecording);
            recPlayBtn.addEventListener('click', playRecording);
            prevBtn.addEventListener('click', () => { if (currentSlideIndex > 0) { currentSlideIndex--;
                updateSlide(); } });
            nextBtn.addEventListener('click', () => { if (currentSlideIndex < 199) { currentSlideIndex++;
                updateSlide(); } });
            menuToggleBtn.addEventListener('click', (e) => { e.stopPropagation();
                menuPanel.classList.toggle('active'); });
            langChineseBtn.addEventListener('click', () => switchLanguage('chinese'));
            langEnglishBtn.addEventListener('click', () => switchLanguage('english'));
            document.addEventListener('click', (e) => { if (!menuPanel.contains(e.target) && e.target !== menuToggleBtn)
                menuPanel.classList.remove('active'); });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' && currentSlideIndex > 0) { currentSlideIndex--;
                    updateSlide(); }
                if (e.key === 'ArrowRight' && currentSlideIndex < 199) { currentSlideIndex++;
                    updateSlide(); }
            });
            updateSlide();
        })();
    </script>
</body>
</html>
